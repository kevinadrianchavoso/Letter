<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter4U ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-blue: #0077b6;
            --soft-blue: #ade8f4;
            --primary-yellow: #fffcd4; 
            --bg-pattern: #fdfae7;
            --text-color: #333; 
        }
        
        body { 
            background: linear-gradient(180deg, #caf0f8 0%, #ade8f4 100%);
            font-family: 'Quicksand', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
            overflow-x: hidden;
        }

        .heart {
            position: fixed;
            top: -10%;
            color: #ff85a1;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .container { 
            background: var(--primary-yellow); 
            padding: 2.5rem 1.5rem; 
            border-radius: 30px; 
            box-shadow: 0 15px 45px rgba(0, 119, 182, 0.25); 
            width: 90%; 
            max-width: 450px; 
            text-align: center; 
            border: 6px solid #fdf2a9;
            position: relative;
            z-index: 10;
            box-sizing: border-box;
        }

        h1 { font-family: 'Pacifico', cursive; color: var(--primary-blue); font-size: 2rem; margin: 0 0 1rem; }
        
        .input-group { margin-bottom: 1rem; text-align: left; }
        label { color: var(--primary-blue); font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px; }
        
        textarea, input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid var(--soft-blue); 
            border-radius: 15px; 
            font-family: inherit; 
            box-sizing: border-box; 
            outline: none; 
        }

        button { 
            background: var(--primary-blue); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 50px; 
            font-weight: 600; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0, 119, 182, 0.3); 
        }
        
        .hidden { display: none !important; }

        .letter-content { 
            font-size: 1.05rem; 
            line-height: 1.8rem;
            white-space: pre-wrap; 
            word-wrap: break-word; 
            padding: 20px; 
            margin: 15px 0; 
            text-align: left;
            background: white;
            border: 2px dashed var(--soft-blue);
            border-radius: 15px;
            max-height: 250px;
            overflow-y: auto;
        }

        .char { display: inline; opacity: 0; animation: letter-pop 0.4s forwards; }
        @keyframes letter-pop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .envelope-wrapper { cursor: pointer; margin: 20px 0; }
        .envelope-icon { font-size: 80px; display: block; }

        .uploaded-photo-container {
            width: 100%;
            margin: 20px 0;
            border-radius: 20px;
            overflow: hidden;
            border: 5px solid white;
            box-sizing: border-box;
        }
        .uploaded-photo-container img { width: 100%; height: auto; max-height: 350px; object-fit: cover; display: block; }
        #player { position: absolute; top: -999px; visibility: hidden; }
    </style>
</head>
<body>

<div class="container" id="main-card">
    <div id="maker-view">
        <h1>Kyutie E-Letter Layout &lt;3</h1>
        <div class="input-group">
            <label>YouTube Link (Background Music):</label>
            <input type="text" id="yt-link" placeholder="Paste link here...">
        </div>
        <div class="input-group">
            <label>Photo URL Link (From Postimages / Imgur):</label>
            <input type="text" id="photo-url" placeholder="Paste direct image link (.jpg/.png)...">
        </div>
        <div class="input-group">
            <label>Your Message:</label>
            <textarea id="message" rows="6" placeholder="Write your heart out..."></textarea>
        </div>
        <button onclick="createLink()">Generate Link ✨</button>
        
        <div id="result-section" class="hidden">
            <p style="font-size: 0.8rem; margin-top: 15px; color: #023e8a;"><strong>Link Created! You can safely use shorteners now:</strong></p>
            <input type="text" id="share-url" readonly onclick="this.select()" style="margin-top: 5px; font-size: 0.7rem;">
        </div>
    </div>

    <div id="envelope-view" class="hidden">
        <h1>You have a letter!</h1>
        <div class="envelope-wrapper" onclick="openEnvelope()">
            <span class="envelope-icon">✉️</span>
            <p style="color: var(--primary-blue);"><strong>Click envelope to read</strong></p>
        </div>
    </div>

    <div id="letter-view" class="hidden">
        <h1>A Special Letter</h1>
        <div class="letter-content" id="display-text"></div>
        <br>
        <button id="next-to-photo-btn" class="hidden" onclick="showPhotoScreen()">Watch Photo ✨</button>
    </div>

    <div id="photo-view" class="hidden">
        <h1>For You 💛</h1>
        <div class="uploaded-photo-container">
            <img id="custom-photo" alt="Special Memory">
        </div>
    </div>
</div>

<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let player;
    let currentVidId = "";
    let fullMessage = "";
    let finalImageUrl = "";

    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '💛';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = Math.random() * 3 + 2 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 400);

    function onYouTubeIframeAPIReady() {
        const params = new URLSearchParams(window.location.search);
        const dataRaw = params.get('l');
        if(dataRaw) {
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(dataRaw))));
                currentVidId = decoded.v;
                if(currentVidId) {
                    player = new YT.Player('player', {
                        height: '0', width: '0', videoId: currentVidId,
                        playerVars: { 'autoplay': 1, 'mute': 1, 'playlist': currentVidId, 'loop': 1, 'controls': 0 },
                        events: { 'onReady': (e) => { e.target.playVideo(); } }
                    });
                }
            } catch(e) {}
        }
    }

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const dataRaw = params.get('l');
        if(dataRaw) {
            document.getElementById('maker-view').classList.add('hidden');
            document.getElementById('envelope-view').classList.remove('hidden');
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(dataRaw))));
                fullMessage = decoded.m;
                finalImageUrl = decoded.imgUrl;
                if(finalImageUrl) {
                    document.getElementById('custom-photo').src = finalImageUrl;
                }
            } catch(e) { document.getElementById('display-text').innerText = "Broken link! 😿"; }
        }
    }

    function openEnvelope() {
        document.getElementById('envelope-view').classList.add('hidden');
        document.getElementById('letter-view').classList.remove('hidden');
        animateText();
        if (player && typeof player.playVideo === 'function') { player.unMute(); player.setVolume(100); player.playVideo(); }
    }

    function animateText() {
        const container = document.getElementById('display-text');
        container.innerHTML = ""; 
        const chars = fullMessage.split("");
        
        chars.forEach((char, index) => {
            if (char === "\n") {
                container.appendChild(document.createElement('br'));
            } else {
                const span = document.createElement('span');
                span.innerText = char;
                span.classList.add('char');
                span.style.animationDelay = `${index * 0.04}s`; 
                container.appendChild(span);
            }
        });

        if (finalImageUrl) {
            setTimeout(() => {
                document.getElementById('next-to-photo-btn').classList.remove('hidden');
            }, chars.length * 40 + 200);
        }
    }

    function showPhotoScreen() {
        document.getElementById('letter-view').classList.add('hidden');
        document.getElementById('photo-view').classList.remove('hidden');
    }

    function createLink() {
        const msg = document.getElementById('message').value;
        const yt = document.getElementById('yt-link').value;
        const imgUrl = document.getElementById('photo-url').value;
        
        if(!msg) return alert("Write a message! 🌸");
        const vidId = yt.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        
        const data = { m: msg, v: vidId ? vidId[1] : "", imgUrl: imgUrl };
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
        const link = window.location.origin + window.location.pathname + "?l=" + encoded;
        
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('share-url').value = link;
    }
</script>
</body>
</html>
