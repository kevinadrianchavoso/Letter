<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter4U ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-blue: #0077b6;
            --soft-blue: #ade8f4;
            --primary-yellow: #fffcd4; 
            --bg-pattern: #fdfae7;
            --text-color: #333; 
            --accent-pink: #ffafcc;
        }
        
        body { 
            background: linear-gradient(180deg, #caf0f8 0%, #ade8f4 100%);
            font-family: 'Quicksand', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            color: var(--text-color); 
            overflow-x: hidden;
            position: relative;
        }

        .heart {
            position: fixed;
            top: -10%;
            color: #ff85a1;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .sunflower-container {
            position: fixed;
            bottom: -10px;
            right: 20px;
            width: 120px;
            height: 120px;
            z-index: 5;
            pointer-events: none;
        }

        .container { 
            background: var(--primary-yellow); 
            padding: 2.5rem 1.5rem; 
            border-radius: 30px; 
            box-shadow: 0 15px 45px rgba(0, 119, 182, 0.25); 
            width: 90%; 
            max-width: 450px; 
            text-align: center; 
            border: 6px solid #fdf2a9;
            position: relative;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        h1::after { content: ' 🎀'; font-family: initial; font-size: 1.5rem; }
        h1 { font-family: 'Pacifico', cursive; color: var(--primary-blue); font-size: 2rem; margin: 0 0 1rem; line-height: 1.3; }
        
        .input-group { margin-bottom: 1rem; text-align: left; }
        label { color: var(--primary-blue); font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px; }
        
        textarea, input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid var(--soft-blue); 
            border-radius: 15px; 
            font-family: inherit; 
            box-sizing: border-box; 
            outline: none; 
            transition: border 0.3s;
        }

        input[type="file"] {
            font-family: inherit;
            font-size: 0.85rem;
            width: 100%;
        }

        button { 
            background: var(--primary-blue); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 50px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease-out; 
            box-shadow: 0 4px 10px rgba(0, 119, 182, 0.3); 
        }

        button:hover { 
            transform: translateY(-3px) scale(1.05); 
            background: #0096c7; 
        }

        button:disabled {
            background: #a3b1bc;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .hidden { display: none !important; }
        
        .fade-out { opacity: 0; transform: scale(0.9); pointer-events: none; }
        .fade-in { animation: slideUp 0.8s ease forwards; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .letter-content { 
            font-size: 1.05rem; 
            line-height: 1.8rem;
            white-space: pre-wrap; 
            word-wrap: break-word; 
            padding: 20px; 
            margin: 15px 0; 
            text-align: left;
            position: relative;
            background: white;
            background-image: linear-gradient(#e1e1e1 1px, transparent 1px);
            background-size: 100% 1.8rem;
            border: 2px dashed var(--soft-blue);
            border-radius: 15px;
            max-height: 250px;
            overflow-y: auto;
        }

        .char {
            display: inline;
            opacity: 0;
            animation: letter-pop 0.4s forwards;
        }

        @keyframes letter-pop {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .envelope-wrapper { cursor: pointer; transition: transform 0.4s ease; margin: 20px 0; }
        .envelope-wrapper:hover { transform: scale(1.1) rotate(2deg); }
        .envelope-icon { font-size: 80px; display: block; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); }

        .history-section { margin-top: 30px; width: 90%; max-width: 450px; background: white; border-radius: 20px; padding: 15px; border: 3px solid var(--soft-blue); z-index: 10; box-sizing: border-box; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 0.8rem; }
        .copy-btn { background: #caf0f8; color: var(--primary-blue); padding: 5px 10px; font-size: 0.7rem; border-radius: 5px;}

        .uploaded-photo-container {
            width: 100%;
            margin: 20px 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: #fff;
            border: 5px solid white;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .uploaded-photo-container img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            display: block;
        }

        #status-log {
            font-size: 0.75rem;
            color: #d62828;
            margin-top: 5px;
            font-weight: bold;
        }

        #player { position: absolute; top: -999px; visibility: hidden; }
        .silent-hint { font-size: 0.7rem; color: #aaa; text-decoration: underline; cursor: pointer; display: inline-block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container" id="main-card">
    <div id="maker-view">
        <h1>Kyutie E-Letter para sayo &lt;3 </h1>
        <div class="input-group">
            <label>YouTube Link (Background Music Only):</label>
            <input type="text" id="yt-link" placeholder="Paste link here...">
        </div>
        <div class="input-group">
            <label>Upload a Sweet Photo Layout:</label>
            <input type="file" id="photo-file" accept="image/*">
            <div id="status-log"></div>
        </div>
        <div class="input-group">
            <label>Your Message:</label>
            <textarea id="message" rows="6" placeholder="Write your heart out..."></textarea>
        </div>
        <button id="submit-btn" onclick="createLink()">Generate Link ✨</button>
        
        <div id="result-section" class="hidden">
            <p style="font-size: 0.8rem; margin: 0; color: #023e8a; margin-top: 15px;"><strong>Link Created!</strong></p>
            <input type="text" id="share-url" readonly onclick="this.select()" style="margin-top: 5px; font-size: 0.7rem;">
        </div>
    </div>

    <div id="envelope-view" class="hidden">
        <h1>You have a letter!</h1>
        <div class="envelope-wrapper" id="envelope-anim" onclick="openEnvelope()">
            <span class="envelope-icon">✉️</span>
            <p style="color: var(--primary-blue);"><strong>Click the envelope to open</strong></p>
        </div>
    </div>

    <div id="letter-view" class="hidden">
        <h1>A Special Letter</h1>
        <div class="letter-content" id="display-text"></div>
        <p id="music-msg" style="font-size: 0.8rem; color: #aaa; margin: 5px 0 15px;"></p>
        <div onclick="forcePlayMusic()" class="silent-hint">Music silent? Tap here to refresh 🎵</div>
        <br><br>
        <button id="next-to-photo-btn" class="hidden" onclick="showPhotoScreen()">Watch Photo ✨</button>
    </div>

    <div id="photo-view" class="hidden">
        <h1>A Special Photo for You</h1>
        <div class="uploaded-photo-container">
            <img id="custom-photo" alt="Attached Memory">
        </div>
        <br>
        <button onclick="location.href=location.pathname" style="background: var(--soft-blue); color: var(--primary-blue); font-size: 0.8rem;">Make Your Own</button>
    </div>
</div>

<div id="history-box" class="history-section">
    <h3 style="margin-top: 0; color: var(--primary-blue);">My Saved Letters 📚</h3>
    <div id="history-list"></div>
    <button onclick="clearHistory()" style="background: #ffcfcf; color: #d66; padding: 5px 10px; font-size: 0.6rem; margin-top: 10px; border:none; border-radius:5px; cursor:pointer;">Clear All</button>
</div>

<div class="sunflower-container">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 95 Q48 70 50 50" stroke="#2d5a27" stroke-width="3" fill="none" />
        <path d="M50 80 Q65 75 60 65 Q50 70 50 80" fill="#3a7034" />
        <g fill="#ffc300" stroke="#e6ac00" stroke-width="0.3">
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(0 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(45 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(90 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(135 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(180 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(225 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(270 50 50)" />
            <ellipse cx="50" cy="35" rx="6" ry="18" transform="rotate(315 50 50)" />
        </g>
        <circle cx="50" cy="50" r="10" fill="#4b2c20" />
    </svg>
</div>

<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let player;
    let currentVidId = "";
    let fullMessage = "";
    let base64PhotoData = ""; // Photo data stored globally as string

    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '💛';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = Math.random() * 3 + 2 + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 400);

    function onYouTubeIframeAPIReady() {
        const params = new URLSearchParams(window.location.search);
        const dataRaw = params.get('l');
        if(dataRaw) {
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(dataRaw))));
                currentVidId = decoded.v;
                if(currentVidId) {
                    player = new YT.Player('player', {
                        height: '0', width: '0', videoId: currentVidId,
                        playerVars: { 'autoplay': 1, 'mute': 1, 'playlist': currentVidId, 'loop': 1, 'controls': 0 },
                        events: { 'onReady': (e) => { e.target.playVideo(); } }
                    });
                }
            } catch(e) {}
        }
    }

    window.onload = function() {
        displayHistory();
        const params = new URLSearchParams(window.location.search);
        const dataRaw = params.get('l');
        if(dataRaw) {
            document.getElementById('maker-view').classList.add('hidden');
            document.getElementById('history-box').classList.add('hidden');
            document.getElementById('envelope-view').classList.remove('hidden');
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(dataRaw))));
                fullMessage = decoded.m;
                
                // If photo string exists in the URL payload, apply it directly to the img src attribute
                if(decoded.imgData) {
                    base64PhotoData = decoded.imgData;
                    document.getElementById('custom-photo').src = base64PhotoData;
                }
            } catch(e) { document.getElementById('display-text').innerText = "Broken link! 😿"; }
        }
    }

    function forcePlayMusic() {
        if (player && typeof player.playVideo === 'function') {
            player.unMute();
            player.setVolume(100);
            player.playVideo();
            document.getElementById('music-msg').innerText = "🎵 Playing Sweet Melodies...";
        }
    }

    function openEnvelope() {
        const envelopeView = document.getElementById('envelope-view');
        const letterView = document.getElementById('letter-view');
        
        envelopeView.classList.add('fade-out');
        
        setTimeout(() => {
            envelopeView.classList.add('hidden');
            letterView.classList.remove('hidden');
            letterView.classList.add('fade-in');
            
            animateText();
            forcePlayMusic();
        }, 400);
    }

    function animateText() {
        const container = document.getElementById('display-text');
        container.innerHTML = ""; 
        const chars = fullMessage.split("");
        
        chars.forEach((char, index) => {
            if (char === "\n") {
                container.appendChild(document.createElement('br'));
            } else {
                const span = document.createElement('span');
                span.innerText = char;
                span.classList.add('char');
                span.style.animationDelay = `${index * 0.04}s`; 
                container.appendChild(span);
            }
        });

        if (base64PhotoData) {
            setTimeout(() => {
                const nextBtn = document.getElementById('next-to-photo-btn');
                nextBtn.classList.remove('hidden');
                nextBtn.classList.add('fade-in');
            }, chars.length * 40 + 200);
        }
    }

    function showPhotoScreen() {
        forcePlayMusic();
        const letterView = document.getElementById('letter-view');
        const photoView = document.getElementById('photo-view');
        
        letterView.classList.add('fade-out');
        
        setTimeout(() => {
            letterView.classList.add('hidden');
            photoView.classList.remove('hidden');
            photoView.classList.add('fade-in');
        }, 400);
    }

    // Helper utility to convert file streams to web URLs directly via base64 data strings
    function convertFileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function createLink() {
        const msg = document.getElementById('message').value;
        const yt = document.getElementById('yt-link').value;
        const fileInput = document.getElementById('photo-file');
        const submitBtn = document.getElementById('submit-btn');
        const statusLog = document.getElementById('status-log');
        
        if(!msg) return alert("Write a message! 🌸");
        
        const vidId = yt.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        
        submitBtn.disabled = true;
        submitBtn.innerText = "Generating Link... ⏳";
        
        let photoPayload = "";

        if(fileInput.files && fileInput.files[0]) {
            statusLog.style.color = "#0077b6";
            statusLog.innerText = "Encoding sweet photo into your link package...";
            try {
                // Turn the picture file directly into a text string
                photoPayload = await convertFileToBase64(fileInput.files[0]);
            } catch(err) {
                alert("Failed processing photo module.");
                submitBtn.disabled = false;
                return;
            }
        }

        // Pack EVERYTHING inside the URL object
        const data = { m: msg, v: vidId ? vidId[1] : "", imgData: photoPayload };
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
        const link = window.location.origin + window.location.pathname + "?l=" + encoded;
        
        document.getElementById('result-section').classList.remove('hidden');
        document.getElementById('share-url').value = link;
        saveToHistory(msg.substring(0, 20) + "...", link);
        
        submitBtn.disabled = false;
        submitBtn.innerText = "Generate Link ✨";
        statusLog.innerText = "";
    }

    function saveToHistory(label, url) {
        let history = JSON.parse(localStorage.getItem('letterHistory') || '[]');
        history.unshift({ label, url, date: new Date().toLocaleDateString() });
        localStorage.setItem('letterHistory', JSON.stringify(history));
        displayHistory();
    }

    function displayHistory() {
        let history = JSON.parse(localStorage.getItem('letterHistory') || '[]');
        const list = document.getElementById('history-list');
        if(history.length === 0) {
            list.innerHTML = '<p style="font-size: 0.8rem; color: #aaa;">No letters saved yet...</p>';
            return;
        }
        list.innerHTML = history.map(item => `
            <div class="history-item">
                <span><strong>${item.label}</strong></span>
                <button class="copy-btn" onclick="copyToClipboard('${item.url}')">Copy</button>
            </div>
        `).join('');
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => alert("Link copied! 🎀"));
    }

    function clearHistory() {
        if(confirm("Delete all saved letters?")) {
            localStorage.removeItem('letterHistory');
            displayHistory();
            document.getElementById('custom-photo').src = "";
        }
    }
</script>
</body>
</html>
